<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>DIGILOOK · 디카룩</title>
<meta name="theme-color" content="#1b1c1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="디카룩">
<style>
  :root{--body:#25262a;--body2:#1b1c1f;--line:#3a3b40;--text:#f1f1f3;--sub:#9d9ea6;--lime:#c9ff57;--stamp:#ff9b3d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,#3a3c42 0%,#141518 70%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif}
  button{font-family:inherit}
  .device{max-width:460px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#2c2d32,#202125 40%,#1b1c1f);padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px}
  @media(min-width:520px){.device{min-height:auto;margin:24px auto;border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.4);padding:16px 18px 22px}}
  .top{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
  .logo{font:800 15px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:2px;color:#d9d9de}
  .logo b{color:var(--lime)}
  .pills{display:flex;gap:6px}
  .pill{border:1px solid var(--line);background:#2a2b30;color:var(--sub);font-size:11.5px;padding:6px 10px;border-radius:999px;cursor:pointer}
  .pill.on{color:#111;background:var(--lime);border-color:var(--lime);font-weight:700}
  /* LCD */
  .lcd{position:relative;border-radius:14px;background:#0b0c0d;padding:8px;box-shadow:inset 0 0 0 2px #111,inset 0 2px 8px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.06)}
  .screen{position:relative;border-radius:8px;overflow:hidden;background:#050505;min-height:44vh;display:flex;align-items:center;justify-content:center;touch-action:none}
  @media(min-width:520px){.screen{min-height:440px}}
  .screen canvas{max-width:100%;max-height:48vh;display:block}
  @media(min-width:520px){.screen canvas{max-height:520px}}
  .osd{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;pointer-events:none;font:700 11px/1 ui-monospace,Menlo,monospace;color:#e8ffe0;text-shadow:0 1px 2px #000;letter-spacing:.5px}
  .osd span{background:rgba(0,0,0,.35);padding:3px 6px;border-radius:4px;margin-right:4px}
  .empty{text-align:center;color:var(--sub);padding:36px 18px;line-height:1.7;font-size:13.5px}
  .empty .cam{font-size:40px}
  .empty label{display:inline-block;margin-top:12px;background:var(--lime);color:#111;padding:11px 22px;border-radius:999px;font-weight:800;cursor:pointer}
  .marker{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid rgba(255,255,255,.9);border-radius:50%;box-shadow:0 0 18px rgba(255,255,255,.6);pointer-events:none;display:none;transition:opacity .3s}
  .marker::after{content:"⚡";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px}
  .badge{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.65);padding:4px 9px;border-radius:6px;font-size:11.5px;display:none}
  .hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 12px;border-radius:999px;font-size:11.5px;color:#ddd;white-space:nowrap;pointer-events:none}
  .loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);font-size:13px}
  /* intensity */
  .inten{display:grid;grid-template-columns:1fr 40px;gap:10px;align-items:center;padding:14px 6px 0}
  .slwrap{position:relative}
  .bubble{position:absolute;top:-22px;transform:translateX(-50%);background:#3b3c42;color:#fff;font:700 11px/1 ui-monospace,Menlo,monospace;padding:4px 7px;border-radius:999px;pointer-events:none}
  input[type=range]{width:100%;accent-color:var(--lime);height:22px}
  .cmpbtn{height:34px;border-radius:10px;border:1px solid var(--line);background:#2a2b30;color:#ddd;font-size:15px;cursor:pointer;user-select:none;-webkit-user-select:none}
  /* filter strip */
  .strip{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
  .strip::-webkit-scrollbar{display:none}
  .cam{flex:0 0 auto;width:66px;text-align:center;background:none;border:0;color:var(--sub);cursor:pointer;scroll-snap-align:center;padding:0}
  .cam .ic{width:58px;height:46px;margin:0 auto 5px;border-radius:12px;background:#2c2d32;display:flex;align-items:center;justify-content:center;border:1.5px solid transparent}
  .cam.on .ic{border-color:var(--lime);box-shadow:0 0 0 3px rgba(201,255,87,.15)}
  .cam b{display:block;font:800 10.5px/1.15 ui-monospace,Menlo,monospace;color:#e6e6ea;letter-spacing:.3px}
  .cam small{display:block;font-size:9.5px;margin-top:2px}
  .cam.on b{color:var(--lime)}
  .desc{font-size:12px;color:#cfcfd5;line-height:1.55;background:rgba(255,255,255,.04);border-radius:10px;padding:9px 11px;margin:0 2px}
  .desc em{font-style:normal;color:var(--lime);font-weight:700}
  /* tabs */
  .tabs{display:flex;justify-content:space-around;border-top:1px solid #2f3035;padding-top:8px}
  .tab{background:none;border:0;color:var(--sub);font-size:13px;padding:6px 8px;cursor:pointer;position:relative}
  .tab.on{color:#fff;font-weight:800}
  .tab.on::after{content:"";position:absolute;left:30%;right:30%;bottom:-2px;height:2px;border-radius:2px;background:var(--lime)}
  .panel{min-height:60px}
  .row{display:grid;grid-template-columns:92px 1fr 40px;align-items:center;gap:10px;margin:8px 2px;font-size:12.5px}
  .row output{color:var(--sub);font:600 11.5px ui-monospace,Menlo,monospace;text-align:right}
  .note{font-size:11.5px;color:var(--sub);line-height:1.6;margin:6px 2px}
  .opts{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
  .opts select,.opts input{background:#2a2b30;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 8px;font-size:12.5px}
  .flashbig{display:flex;gap:8px;margin:4px 0 8px}
  .flashbig button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#2a2b30;color:#ddd;font-weight:700;cursor:pointer}
  .flashbig button.on{background:#fff3b0;color:#111;border-color:#fff3b0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chips span{font:600 11px ui-monospace,Menlo,monospace;background:#2f3035;border-radius:999px;padding:5px 9px;color:#e6e6ea}
  /* shutter row */
  .shutter-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:6px;position:sticky;bottom:0;padding:12px 2px calc(env(safe-area-inset-bottom) + 6px);background:linear-gradient(180deg,rgba(27,28,31,0),#1b1c1f 35%);z-index:4}
  .gal{justify-self:start;width:50px;height:50px;border-radius:12px;border:2px solid #45464c;background:#2a2b30 center/cover;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:20px}
  .shutter{width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fafafa,#bdbfc4 45%,#8d8f95 70%,#5f6166);box-shadow:0 0 0 5px #141518,0 0 0 7px #3c3d42,0 8px 18px rgba(0,0,0,.6),inset 0 -3px 6px rgba(0,0,0,.35);color:#333;font:800 11px ui-monospace,Menlo,monospace;letter-spacing:1px}
  .shutter:active{transform:scale(.96)}
  .shutter:disabled{opacity:.45}
  .flashq{justify-self:end;width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:#2a2b30;color:#888;font-size:20px;cursor:pointer}
  .flashq.on{background:#fff3b0;color:#111}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#f1f1f3;color:#111;padding:9px 14px;border-radius:999px;font-size:12.5px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div class="device">
  <div class="top">
    <div class="logo">DIGI<b>LOOK</b></div>
    <div class="pills">
      <button class="pill" id="pStamp">DATE</button>
      <button class="pill" id="pCrop">4:3</button>
    </div>
  </div>

  <div class="lcd">
    <div class="screen" id="stage">
      <div class="empty" id="empty">
        <div class="cam">📷</div>
        블로그·인스타 디카 인물 작례 <b style="color:#fff">1,200장</b>을 재서 만든<br>디카 색감으로 폰 사진을 바꿔줘요.<br>
        <label for="file">사진 고르기</label>
        <div class="note" style="margin-top:12px">사진은 서버로 안 올라가고 이 기기 안에서만 처리돼요.</div>
      </div>
      <canvas id="view" style="display:none"></canvas>
      <div class="osd" id="osd" style="display:none"><div><span id="osdModel">IXUS</span><span id="osdFlash">⚡OFF</span></div><div><span id="osdRatio">FULL</span><span>▮▮▮</span></div></div>
      <div class="marker" id="marker"></div>
      <div class="badge" id="badge">원본</div>
      <div class="hint" id="hint" style="display:none">플래시는 얼굴을 톡 눌러 위치를 정해요</div>
      <div class="loading" id="loading">저장 중...</div>
    </div>
  </div>

  <div class="inten">
    <div class="slwrap"><div class="bubble" id="bubble">80</div><input type="range" id="strength" min="0" max="100" step="1" value="80" aria-label="색감 강도"></div>
    <button class="cmpbtn" id="compare" title="누르고 있으면 원본">◧</button>
  </div>

  <div class="strip" id="strip"></div>
  <div class="desc" id="desc"></div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-t="flash">플래시</button>
    <button class="tab" data-t="adjust">조정</button>
    <button class="tab" data-t="stamp">스탬프</button>
    <button class="tab" data-t="recipe">레시피</button>
  </div>
  <div class="panel" id="panel"></div>

  <div class="shutter-row">
    <label class="gal" id="gal" for="file" title="사진 열기">＋</label>
    <button class="shutter" id="save" disabled title="저장">SAVE</button>
    <button class="flashq" id="flashq" title="플래시 켜기/끄기">⚡</button>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
(() => {

  // body: 아이콘 몸체 색

    ys[0]= st*Math.max(0,tp[0]-I.pct[0])*0.6;
    ys[7]+=P.blow*(100-ys[7])*0.65; ys[6]+=P.blow*(100-ys[6])*0.3; ys[5]+=P.blow*(100-ys[5])*0.1;
    for(let i=1;i<xs.length;i++){ if(xs[i]<=xs[i-1]+0.5) xs[i]=xs[i-1]+0.5; if(ys[i]<=ys[i-1]+0.3) ys[i]=Math.min(100,ys[i-1]+0.3); }
    xs[xs.length-1]=Math.max(xs[xs.length-1],100);
    const tone=monoCurve(xs,ys);
    const centers=[17.5,52.5,85], sig=15;
    const bandXf=(L,a,b)=>{ if(!T) return [a,b]; let wsum=0, na=0, nb=0;
      for(let i=0;i<3;i++){ const w=Math.exp(-((L-centers[i])**2)/(2*sig*sig)); const ib=I.bands[i], tb=T.bands[i];
        const valid=ib.n>0; const ia=valid?ib.a:a, ibb=valid?ib.b:b, iC=valid?Math.max(2,ib.C):Math.hypot(a,b)+2;
        const k=Math.max(0.45,Math.min(1.6,tb.C/iC)); na+=w*(tb.a+(a-ia)*k); nb+=w*(tb.b+(b-ibb)*k); wsum+=w; }
      na/=wsum; nb/=wsum; let da=s*(na-a), db=s*(nb-b); const lim=14; da=Math.max(-lim,Math.min(lim,da)); db=Math.max(-lim,Math.min(lim,db)); return [a+da,b+db]; };
    let sk=null;
    if(T && I.skin.n>0 && I.skin.frac>0.01){ const [pa,pb]=bandXf(I.skin.L,I.skin.a,I.skin.b); sk={L:I.skin.L,a:I.skin.a,b:I.skin.b, da:T.skin.a-pa, db:T.skin.b-pb, dL:T.skin.L-tone(I.skin.L)}; }
    const lr=v=>{v/=255; return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
    const lut=new Uint8ClampedArray(N*N*N*3); let p=0;
    for(let bi=0;bi<N;bi++) for(let gi=0;gi<N;gi++) for(let ri=0;ri<N;ri++){
      let [L,a,b]=rgbf2lab(lr(ri*255/(N-1)),lr(gi*255/(N-1)),lr(bi*255/(N-1)));
      let L2=tone(L); let [a2,b2]=bandXf(L,a,b);
      if(sk && ss>0){ const w=Math.exp(-(((a-sk.a)**2+(b-sk.b)**2)/(2*14*14)) - ((L-sk.L)**2)/(2*26*26)); a2+=ss*w*sk.da; b2+=ss*w*sk.db; L2+=ss*w*Math.max(-8,Math.min(8,sk.dL))*0.6; }
      if(P.temp){ b2+=P.temp*8; a2+=P.temp*1.2; }
      if(P.sat){ a2*=1+P.sat; b2*=1+P.sat; }
      if(L2>88){ const k=1-Math.min(1,(L2-88)/12)*(0.4+0.5*P.blow); a2*=k; b2*=k; }
      const o=lab2rgb(Math.max(0,Math.min(100,L2)),a2,b2); lut[p++]=o[0]; lut[p++]=o[1]; lut[p++]=o[2];
    }
    lutCache.key=key; lutCache.lut=lut; return lut;
  }

  function blurCopy(src,factor){ const w=src.width,h=src.height, sw=Math.max(2,Math.round(w/factor)), sh=Math.max(2,Math.round(h/factor));
    const a=document.createElement('canvas'); a.width=sw; a.height=sh; const ac=a.getContext('2d'); ac.imageSmoothingQuality='high'; ac.drawImage(src,0,0,sw,sh);
    const b=document.createElement('canvas'); b.width=w; b.height=h; const bc=b.getContext('2d',{willReadFrequently:true}); bc.imageSmoothingEnabled=true; bc.imageSmoothingQuality='high'; bc.drawImage(a,0,0,w,h);
    return bc.getImageData(0,0,w,h).data; }
  function blurSmooth(src,factor){ const w=src.width,h=src.height; let cur=src, cw=w, ch=h; const steps=[];
    while(cw/2>=w/factor && cw>8){ cw=Math.round(cw/2); ch=Math.round(ch/2); const c=document.createElement('canvas'); c.width=cw; c.height=ch; const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(cur,0,0,cw,ch); cur=c; steps.push([cw,ch]); }
    for(let i=steps.length-2;i>=-1;i--){ const [tw,th]=i>=0?steps[i]:[w,h]; const c=document.createElement('canvas'); c.width=tw; c.height=th; const x=c.getContext('2d',{willReadFrequently:i<0}); x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high'; x.drawImage(cur,0,0,tw,th); cur=c; }
    return cur.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data; }

  // ---------- 인물 인식 (배경 흐림용, 처음 한 번 인터넷으로 모델 받음) ----------
  let segmenter=null, segLoading=null, maskCanvas=null, segFailed=false, segBusy=false, bokehMsg='';
  const setBokehStatus=t=>{ bokehMsg=t; const el=$('bokehStatus'); if(el&&t) el.textContent=t; };
  async function ensureSegmenter(){ if(segmenter) return segmenter; if(segLoading) return segLoading;
    segLoading=(async()=>{ const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
      const vision=await import(V+'/vision_bundle.mjs'); const files=await vision.FilesetResolver.forVisionTasks(V+'/wasm');
      segmenter=await vision.ImageSegmenter.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite',delegate:'CPU'},runningMode:'IMAGE',outputCategoryMask:false,outputConfidenceMasks:true});
      return segmenter; })();
    return segLoading; }
  async function buildMask(){ const src=previewSrc; if(!src||segBusy) return; segBusy=true; setBokehStatus('인물 인식 중...');
    try{ const seg=await ensureSegmenter(); const r=seg.segment(src); const bgm=r.confidenceMasks[0]; const w=bgm.width,h=bgm.height, arr=bgm.getAsFloat32Array();
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); const id=x.createImageData(w,h);
      for(let i=0;i<w*h;i++){ let p=1-arr[i]; p=p<0.3?0:p>0.7?1:(p-0.3)/0.4; const v=p*255; id.data[i*4]=v; id.data[i*4+1]=v; id.data[i*4+2]=v; id.data[i*4+3]=255; }
      x.putImageData(id,0,0); r.confidenceMasks.forEach(m=>m.close&&m.close());
      const f=document.createElement('canvas'); f.width=w; f.height=h; const fx=f.getContext('2d'); fx.filter='blur('+Math.max(1,Math.round(Math.max(w,h)/400))+'px)'; fx.drawImage(c,0,0);
      if(src===previewSrc){ maskCanvas=f; setBokehStatus('인물 인식 완료: 배경만 흐려요'); }
    }catch(e){ segFailed=true; console.warn(e); setBokehStatus('인물 인식을 못 해서 ⚡ 위치 기준으로 흐려요 (인터넷 연결 필요)'); }
    segBusy=false; schedule(); }
  function getMaskData(w,h,C){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d',{willReadFrequently:true});
    if(maskCanvas){ x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high'; x.drawImage(maskCanvas,0,0,w,h); }
    else { const r=Math.max(w,h)*0.42; const g=x.createRadialGradient(C.x*w,C.y*h,0,C.x*w,C.y*h,r); g.addColorStop(0,'#fff'); g.addColorStop(0.5,'#fff'); g.addColorStop(1,'#000'); x.fillStyle='#000'; x.fillRect(0,0,w,h); x.fillStyle=g; x.fillRect(0,0,w,h); }
    return x.getImageData(0,0,w,h).data; }

  function processImage(srcCanvas,P,C,O){
    const w=srcCanvas.width,h=srcCanvas.height; let work=srcCanvas;
    if(O.soft){ const f=Math.max(1.6,Math.max(w,h)/1100); const s=document.createElement('canvas'); s.width=Math.round(w/f); s.height=Math.round(h/f); s.getContext('2d').drawImage(srcCanvas,0,0,s.width,s.height);
      const u=document.createElement('canvas'); u.width=w; u.height=h; const uc=u.getContext('2d'); uc.imageSmoothingEnabled=true; uc.drawImage(s,0,0,w,h); work=u; }
    const d=work.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
    const bS=P.sharp>0?blurCopy(work,2.2):null;
    const lut=buildLUT(P); const NM=N-1, sc=NM/255;
    const diag=Math.hypot(w,h), sigma=(0.06+P.radius*0.30)*diag, inv2s2=1/(2*sigma*sigma), cx=C.x*w, cy=C.y*h;
    const flash=P.flash, bg=P.bg, sharp=P.sharp*1.3, evg=Math.pow(2,P.ev*2), useLin=flash>0||bg>0||P.ev!==0;
    const out=new ImageData(w,h), o=out.data;
    for(let y=0;y<h;y++){ const dy=(y-cy)*0.8, dy2=dy*dy;
      for(let x=0;x<w;x++){ const i=(y*w+x)*4;
        let r=d[i],g=d[i+1],b=d[i+2];
        if(bS){ r+=(r-bS[i])*sharp; g+=(g-bS[i+1])*sharp; b+=(b-bS[i+2])*sharp; r=r<0?0:r>255?255:r; g=g<0?0:g>255?255:g; b=b<0?0:b>255?255:b; }
        if(useLin){ const dx=x-cx, f=Math.exp(-(dx*dx+dy2)*inv2s2), nf=1-f;
          const gain=evg*(1+flash*1.1*f)*(1-bg*0.9*Math.pow(nf,0.7)), fill=flash*0.008*f;
          let lr=toLin[r|0]*gain+fill, lg=toLin[g|0]*gain+fill, lb=toLin[b|0]*gain+fill*1.04;
          lr=lr>1?1:lr; lg=lg>1?1:lg; lb=lb>1?1:lb; r=toSrgb[(lr*LUTN)|0]; g=toSrgb[(lg*LUTN)|0]; b=toSrgb[(lb*LUTN)|0]; }
        const fr=r*sc, fg=g*sc, fb=b*sc; let r0=fr|0, g0=fg|0, b0=fb|0; if(r0>=NM) r0=NM-1; if(g0>=NM) g0=NM-1; if(b0>=NM) b0=NM-1;
        const tr=fr-r0, tg=fg-g0, tb=fb-b0;
        const i000=((b0*N+g0)*N+r0)*3, i100=i000+3, i010=i000+N*3, i110=i010+3, i001=i000+N*N*3, i101=i001+3, i011=i001+N*3, i111=i011+3;
        for(let c=0;c<3;c++){
          const c00=lut[i000+c]+(lut[i100+c]-lut[i000+c])*tr, c10=lut[i010+c]+(lut[i110+c]-lut[i010+c])*tr;
          const c01=lut[i001+c]+(lut[i101+c]-lut[i001+c])*tr, c11=lut[i011+c]+(lut[i111+c]-lut[i011+c])*tr;
          const c0=c00+(c10-c00)*tg, c1=c01+(c11-c01)*tg; o[i+c]=c0+(c1-c0)*tb; }
        o[i+3]=255;
      }
    }
    if(P.bokeh>0){
      const md=getMaskData(w,h,C);
      const bgc=document.createElement('canvas'); bgc.width=w; bgc.height=h; const bgx=bgc.getContext('2d'); const bid=bgx.createImageData(w,h);
      const wc=document.createElement('canvas'); wc.width=w; wc.height=h; const wx=wc.getContext('2d'); const wid=wx.createImageData(w,h);
      for(let i=0;i<o.length;i+=4){ const k=1-md[i]/255; bid.data[i]=o[i]*k; bid.data[i+1]=o[i+1]*k; bid.data[i+2]=o[i+2]*k; bid.data[i+3]=255; wid.data[i]=k*255; wid.data[i+3]=255; }
      bgx.putImageData(bid,0,0); wx.putImageData(wid,0,0);
      const factor=Math.max(2,P.bokeh*Math.max(w,h)/45);
      const bb=blurSmooth(bgc,factor), wb=blurSmooth(wc,factor);
      for(let i=0;i<o.length;i+=4){ const m=md[i]/255; if(m>=0.999) continue; const ww=wb[i]/255;
        let R=o[i],G=o[i+1],B=o[i+2]; if(ww>0.03){ R=bb[i]/ww; G=bb[i+1]/ww; B=bb[i+2]/ww; }
        o[i]=o[i]*m+R*(1-m); o[i+1]=o[i+1]*m+G*(1-m); o[i+2]=o[i+2]*m+B*(1-m); }
    }
    const res=document.createElement('canvas'); res.width=w; res.height=h; const rc=res.getContext('2d',{willReadFrequently:true}); rc.putImageData(out,0,0);
    const glow=P.glow, mist=P.mist, vig=P.vig, grain=P.grain;
    if(glow>0||mist>0||vig>0||grain>0){
      const bl=(glow>0||mist>0)?blurCopy(res,Math.max(10,Math.max(w,h)/70)):null;
      const vcx=w/2,vcy=h/2,vr=1/Math.hypot(w/2,h/2); let seed=987654321;
      for(let y=0;y<h;y++){ const vy=y-vcy; for(let x=0;x<w;x++){ const i=(y*w+x)*4; let R=o[i],G=o[i+1],B=o[i+2];
        if(bl){
          if(glow>0){ const lum=(0.2126*bl[i]+0.7152*bl[i+1]+0.0722*bl[i+2])/255; let hl=(lum-0.55)/0.4; if(hl>0){ if(hl>1)hl=1; const k=hl*hl*glow*0.7;
            R=255-(255-R)*(1-k*bl[i]/255*1.02); G=255-(255-G)*(1-k*bl[i+1]/255); B=255-(255-B)*(1-k*bl[i+2]/255*0.97); } }
          if(mist>0){ const k=mist*0.4; R+=(bl[i]-R)*k; G+=(bl[i+1]-G)*k; B+=(bl[i+2]-B)*k; const lift=mist*16; R+=lift*(1-R/255); G+=lift*(1-G/255); B+=lift*(1-B/255); }
        }
        if(vig>0){ const vx=x-vcx, vd=Math.sqrt(vx*vx+vy*vy)*vr, vv=1-vig*0.55*vd*vd*vd; R*=vv; G*=vv; B*=vv; }
        if(grain>0){ seed=(seed*1664525+1013904223)>>>0; const n1=seed/4294967296-0.5; seed=(seed*1664525+1013904223)>>>0; const n2=seed/4294967296-0.5;
          const L=(0.299*R+0.587*G+0.114*B)/255, amp=grain*24*(0.45+0.55*(1-L));
          R+=n1*amp+n2*amp*0.35*(1-L); G+=n1*amp; B+=n1*amp-n2*amp*0.35*(1-L); }
        o[i]=R; o[i+1]=G; o[i+2]=B; } }
      rc.putImageData(out,0,0);
    }
    if(O.stamp) drawStamp(rc,w,h,O);
    return res;
  }

  // 7세그먼트 느낌 날짜 스탬프 (주황/노랑, 세로 사진은 세로로도)
  function drawStamp(ctx,w,h,O){ const [Y,M,D]=(dateVal||new Date().toISOString().slice(0,10)).split('-');
    const now=new Date(), hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0');
    const f=O.stampFmt; const text=f==='quote'?`'${Y.slice(2)} ${M} ${D}`:f==='dot'?`${Y}.${M}.${D}`:f==='time'?`${Y}/${M}/${D} ${hh}:${mm}`:`${Y}/${M}/${D}`;
    const yellow=O.stampColor==='yellow'; const size=Math.round(Math.min(w,h)*0.05);
    ctx.save(); ctx.font=`700 ${size}px "DS-Digital","Courier New",ui-monospace,monospace`; ctx.textBaseline='bottom';
    const vertical=O.stampRot && h>w;
    if(vertical){ ctx.translate(w-size*0.8, h-size*0.9); ctx.rotate(-Math.PI/2); ctx.textAlign='left'; }
    else { ctx.translate(w-size*0.9, h-size*0.7); ctx.textAlign='right'; }
    ctx.shadowColor=yellow?'rgba(255,190,0,.85)':'rgba(255,90,0,.9)'; ctx.shadowBlur=size*0.45; ctx.fillStyle=yellow?'#ffd84a':'#ff9b3d'; ctx.fillText(text,0,0);
    ctx.shadowBlur=size*0.12; ctx.fillStyle=yellow?'#fff1a0':'#ffc07a'; ctx.fillText(text,0,0); ctx.restore(); }

  $('save').onclick=async()=>{ if(!srcImg) return; $('loading').style.display='flex'; await new Promise(r=>setTimeout(r,30));
    try{ const full=makeSrcCanvas(3200); const res=processImage(full,params,center,opts); const blob=await new Promise(r=>res.toBlob(r,'image/jpeg',0.93));
      const name=`DIGILOOK_${LOOKS[lookKey].code.replace(/\W+/g,'')}_${Date.now()}.jpg`, file=new File([blob],name,{type:'image/jpeg'});
      if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)) await navigator.share({files:[file],title:'디카룩'});
      else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
      toast('저장했어요');
    }catch(e){ if(e.name!=='AbortError') alert('저장 중 문제가 생겼어요: '+e.message); }
    $('loading').style.display='none'; };

  renderTab(); selectLook(lookKey); loadRecipe();
  window.__digicam={ loadFile, setLook:k=>selectLook(k), setCenter:(x,y)=>{center={x,y};schedule();}, getStats:()=>inStats, tab:t=>$('tabs').querySelector(`[data-t="${t}"]`).click(),
    bench:()=>{ const t0=performance.now(); lutCache.key=null; buildLUT(params); const t1=performance.now(); processImage(previewSrc,params,center,opts); return {lut:t1-t0, process:performance.now()-t1}; } };
})();
</script>
